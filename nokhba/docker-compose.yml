# Local/production-style stack: PostgreSQL (with pgvector available) + the Nokhba app.
#   docker compose up -d db          # database only (then run the app with npm run dev)
#   docker compose up --build        # full stack on http://localhost:3000
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nokhba
    ports:
      - "5433:5432"
    volumes:
      - nokhba-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nokhba"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/nokhba?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      AI_PROVIDER: ${AI_PROVIDER:-local}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    # Apply migrations and seed demo data on first start, then serve.
    command: sh -c "node node_modules/prisma/build/index.js migrate deploy && node server.js"
    ports:
      - "3000:3000"
    volumes:
      - nokhba-uploads:/app/storage

volumes:
  nokhba-db:
  nokhba-uploads:
