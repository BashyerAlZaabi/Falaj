<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef1f5">
<title>منصة العمل الذكية</title>
<link rel="icon" href="/img/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<!-- Login -->
<section id="login" class="hidden" aria-labelledby="login-title">
  <form class="login-card glass" id="login-form" autocomplete="on">
    <div class="brand-mark" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12l5 5L20 6"/></svg></div>
    <h1 id="login-title" data-i18n="login.title">تسجيل الدخول الموحّد</h1>
    <p class="muted small" data-i18n="login.sub">منصة العمل الذكية — Unified Portal و ADAA I و Ask AI</p>
    <label class="lbl" for="lg-user" data-i18n="login.user">اسم المستخدم</label>
    <input class="field" id="lg-user" name="username" autocomplete="username" required>
    <label class="lbl" for="lg-pass" data-i18n="login.pass">كلمة المرور</label>
    <input class="field" id="lg-pass" name="password" type="password" autocomplete="current-password" required>
    <div class="err" id="lg-err" role="alert"></div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="btn primary" type="submit" data-i18n="login.submit">دخول</button>
      <button class="btn ghost sm" type="button" id="lg-lang">English</button>
    </div>
    <div class="demo-list" id="demo-list">
      <div class="small muted"><span class="chip demo" data-i18n="demo">تجريبي</span> <span data-i18n="login.demo">حسابات تجريبية — كلمة المرور: Demo@2026</span></div>
    </div>
  </form>
</section>

<!-- App shell -->
<div id="app" class="hidden">
  <aside class="nav glass" id="nav" aria-label="التنقل">
    <div class="logo"><div class="brand-mark" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12l5 5L20 6"/></svg></div><span data-i18n="brand">منصة العمل الذكية</span></div>
    <div id="nav-items"></div>
    <div class="foot">
      <div class="nav-tools">
        <button class="icon-btn" id="btn-lang" title="Language"><span class="tiny">EN</span></button>
        <button class="icon-btn" id="btn-theme" title="Theme"></button>
        <button class="icon-btn" id="btn-logout" title="Logout"></button>
      </div>
      <div class="user-card" id="user-card"></div>
    </div>
  </aside>
  <div class="scrim hidden" id="scrim"></div>

  <main class="main glass" id="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="btn-menu" aria-label="القائمة"></button>
      <h2 id="view-title"></h2>
      <div class="search">
        <span class="icon-slot"></span>
        <input class="field" id="search" type="search" data-i18n-ph="search.ph" placeholder="ابحث في مساحة العمل…" autocomplete="off" aria-label="بحث">
        <div class="search-results glass hidden" id="search-results" role="listbox"></div>
      </div>
      <span class="chip" id="rt-status" title="realtime"><span class="dot"></span></span>
    </header>
    <div class="view" id="view" tabindex="-1"></div>
  </main>

  <section class="panel glass" id="chat" aria-label="Ask AI">
    <div class="panel-head">
      <button class="icon-btn collapse-btn" id="chat-collapse" aria-label="طي المحادثة"></button>
      <h3>Ask AI <span class="chip tiny" id="ai-mode"></span></h3>
      <button class="icon-btn hide-collapsed" id="chat-new" title="محادثة جديدة"></button>
      <button class="icon-btn hide-collapsed" id="chat-history" title="السجل"></button>
      <button class="icon-btn hide-collapsed" id="chat-expand" title="توسيع"></button>
    </div>
    <div class="panel-body" id="chat-body" aria-live="polite"></div>
    <div class="composer">
      <div class="context-bar" id="context-bar"></div>
      <div class="voice-bar hidden" id="voice-bar" role="status">
        <span class="dot"></span><span id="voice-state">يستمع…</span><span class="interim" id="voice-interim"></span>
        <button class="btn sm" id="voice-stop" type="button">إيقاف</button>
      </div>
      <div class="row">
        <button class="icon-btn" id="btn-attach" title="إرفاق ملف" type="button"></button>
        <input type="file" id="file-input" class="hidden" accept=".txt,.md,.csv,.json,.docx">
        <textarea id="chat-input" rows="1" data-i18n-ph="chat.ph" placeholder="اكتب طلبك… مثال: جهّز لي ملخص اليوم"></textarea>
        <button class="icon-btn mic" id="btn-mic" title="تحدّث" type="button" aria-pressed="false"></button>
        <button class="icon-btn" id="btn-mute" title="كتم الرد الصوتي" type="button" aria-pressed="false"></button>
        <button class="btn primary" id="btn-send" type="button" aria-label="إرسال"></button>
      </div>
    </div>
  </section>

  <section class="panel glass collapsed" id="editor" aria-label="المستند"></section>
</div>

<nav class="tabbar glass" id="tabbar" aria-label="تبويبات"></nav>
<div id="toast" aria-live="polite"></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
